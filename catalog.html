<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог - Danchukes-store</title>
    <meta name="description" content="Каталог кросівок Danchukes-store: Nike, New Balance, Puma, Salomon, Premiata та інші. Пошук, фільтр за брендом і сортування за ціною.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A6%86</text></svg>">
    <!-- Bootstrap 5 (підключення через CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Свої стилі підключаємо ПІСЛЯ Bootstrap, щоб вони могли його перевизначати -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header header-page" id="top">
        <a class="logo" href="index.html">Danchukes-store 🦆</a>
        <h1>Каталог</h1>
        <div class="d-flex gap-2">
            <a class="btn" href="cart.html" aria-label="Кошик">🛒 <span class="cart-count" data-cart-count hidden>0</span></a>
            <a class="btn" href="index.html" aria-label="На головну">✖</a>
        </div>
    </header>
    <nav class="subnav">
        <a href="index.html">Головна</a>
        <a href="catalog.html" aria-current="page">Каталог</a>
        <a href="about.html">Про нас</a>
        <a href="contacts.html">Контакти</a>
    </nav>

    <main class="container">
        <!-- Пошук і сортування -->
        <form class="catalog-toolbar" id="catalog-tools" role="search">
            <input type="search" id="catalog-search" class="form-control rounded-pill" placeholder="🔍 Пошук моделі..." aria-label="Пошук моделі">
            <select id="catalog-sort" class="form-select rounded-pill" aria-label="Сортування">
                <option value="default">За замовчуванням</option>
                <option value="cheap">Спочатку дешевші</option>
                <option value="expensive">Спочатку дорожчі</option>
                <option value="name">За назвою</option>
            </select>
        </form>

        <!-- Кнопки брендів підставляє shop.js -->
        <div id="brand-chips" class="chips"></div>
        <p id="catalog-count" class="small text-muted mb-2"></p>

        <!-- Картки товарів підставляє shop.js зі списку PRODUCTS -->
        <section id="catalog-grid" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3"></section>

        <div id="catalog-empty" class="text-center py-5" hidden>
            <div class="big-emoji">🦆</div>
            <h2>Нічого не знайдено</h2>
            <p>Спробуйте іншу назву або скиньте фільтри.</p>
            <button type="button" class="btn" id="catalog-reset">Скинути фільтри</button>
        </div>

        <div class="text-center my-4">
            <a class="btn btn-big" href="#top">Назад до початку сторінки</a>
        </div>
    </main>

    <footer class="footer mt-5">
        <div class="container d-flex justify-content-between align-items-end">
            <div>
                <h2 class="h4">Danchukes-store</h2>
                <p>📞 <a href="tel:+380977653938"><strong>+380 97 765 39 38</strong></a></p>
                <p>✉️ <a href="mailto:danchukesstore@gmail.com"><strong>danchukesstore@gmail.com</strong></a></p>
                <p><small>© 2026 Danchukes-store. Усі права захищено.</small></p>
            </div>
            <div class="footer-duck">🦆</div>
        </div>
    </footer>

    <script src="shop.js"></script>
</body>
</html>
